// vehicles.js 검증 하네스
//  ?view=rear (기본, 게임 추격캠 각도) | front (앞 3/4) | side | top | lineup (측면 정사영 비율 비교) | jam (실제 정체 장면)
//  ?night=1  ?brake=1 ?hazard=1 ?head=1 ?flash=0..1 ?detailed=1(NPC도 detailed) ?anim=1(바퀴/비상등 애니)
//  ?kinds=sedan,bus  ?proj=0(투사체 줄 숨김)  ?stats=1(콘솔/하단 요약)  ?stage=N (jam 뷰 원흉)  ?seed=N
//  window.__veh = { stats, scene, ... } 노출 (스크린샷 --eval 용)
// ════════════════════════════════════════════════════════════════════════
import * as THREE from 'three';
import * as V from '../js/vehicles.js';
import { SKY, laneX, NUM_LANES, LANE_W, NPC_KINDS, NPC_COLORS_MONO, NPC_COLORS_POP, STAGES, OPP_LANE_X } from '../js/config.js';

const Q = new URLSearchParams(location.search);
const view = Q.get('view') || 'rear';
const night = Q.get('night') === '1';
const flag = (k, d = false) => (Q.has(k) ? Q.get(k) !== '0' : d);
const state = {
  brake: flag('brake', view === 'jam'), hazard: flag('hazard'), head: flag('head', night), flash: +(Q.get('flash') || 0),
  detailed: flag('detailed'), anim: flag('anim'), proj: flag('proj', view !== 'jam' && view !== 'lineup'), siren: flag('siren'),
};
const ALL_KINDS = ['compact', 'sedan', 'suv', 'taxi', 'van', 'pickup1t', 'truck', 'bus', 'police', 'player', 'villainSedan', 'villainTruck', 'villainSuv', 'villainPhone', 'tractor'];
const DETAILED = new Set(['player', 'villainSedan', 'villainTruck', 'villainSuv', 'villainPhone', 'tractor']);
const VILLAIN_COLOR = { villainSedan: 0xd9c9a3, villainTruck: 0x2f6fd6, villainSuv: 0x1d1f22, villainPhone: 0xe85d9a, tractor: 0x3f8f3a };
const kinds = (Q.get('kinds') || ALL_KINDS.join(',')).split(',').filter(Boolean);
const seed = +(Q.get('seed') || 0);
const sky = night ? SKY.night : SKY.day;

// ── UI
const ui = document.getElementById('ui');
const base = new URLSearchParams(location.search);
for (const v of ['rear', 'front', 'side', 'top', 'lineup', 'jam']) {
  const p = new URLSearchParams(base); p.set('view', v);
  const a = document.createElement('a'); a.href = '?' + p; a.textContent = v; if (v === view) a.className = 'on'; ui.appendChild(a);
}
{ const p = new URLSearchParams(base); p.set('night', night ? '0' : '1'); const a = document.createElement('a'); a.href = '?' + p; a.textContent = night ? 'day' : 'night'; ui.appendChild(a); }
for (const k of ['brake', 'hazard', 'head', 'detailed', 'anim', 'siren']) {
  const l = document.createElement('label'); const i = document.createElement('input'); i.type = 'checkbox'; i.checked = state[k];
  i.onchange = () => { state[k] = i.checked; if (k === 'detailed') { const p = new URLSearchParams(location.search); p.set('detailed', i.checked ? '1' : '0'); location.search = p; } applyLights(); dirty = true; };
  l.append(i, k); ui.appendChild(l);
}
{
  const l = document.createElement('label'); const i = document.createElement('input'); i.type = 'range'; i.min = 0; i.max = 1; i.step = 0.05; i.value = state.flash; i.style.width = '60px';
  i.oninput = () => { state.flash = +i.value; applyLights(); dirty = true; }; l.append('flash ', i); ui.appendChild(l);
}

// ── 렌더러 / 씬
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(true);
const scene = new THREE.Scene();
const bg = new THREE.Color(night ? 0x1c2148 : 0xbcd6e6);
scene.background = bg;
const hemi = new THREE.HemisphereLight(sky.hemiSky ?? 0xbfe4ff, sky.hemiGround ?? 0x8a9a6a, sky.hemiI ?? 1.25);
const sun = new THREE.DirectionalLight(sky.sun ?? 0xfff4dc, sky.sunI ?? 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;

scene.add(hemi, sun, sun.target);
function aimSun(cx, cz, half) {

  sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 1; sc.far = 260; sc.updateProjectionMatrix();
  sun.target.position.set(cx, 0, cz); sun.position.set(cx, 0, cz).addScaledVector(sunDir, 120);

// 도로: 진회색 아스팔트 + 차선 점선
const asphalt = night ? 0x2a2d33 : 0x5b5f66;
function makeRoad(w, l, cz = 0) {

  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, l), new THREE.MeshLambertMaterial({ color: asphalt }));
  p.rotation.x = -Math.PI / 2; p.position.z = cz; p.receiveShadow = true; g.add(p);
  const dash = new THREE.MeshLambertMaterial({ color: 0xe8e8e2 });
  const dg = new THREE.PlaneGeometry(0.16, 3); dg.rotateX(-Math.PI / 2);
  for (let i = 1; i < NUM_LANES; i++) for (let z = cz - l / 2; z < cz + l / 2; z += 9) { const d = new THREE.Mesh(dg, dash); d.position.set(laneX(i) - LANE_W / 2, 0.01, z); d.receiveShadow = true; g.add(d); }

// ── 통계
const tris = (g) => (g.index ? g.index.count : g.attributes.position.count) / 3;

  const bb = new THREE.Box3(); obj.updateMatrixWorld(true);

// ── 차량
const entries = []; // { kind, obj, label, isProj }

}

// 카메라 오프셋 (차량 중심 기준) — rear = 게임 추격캠 (main.js chaseTarget: +2.4, 12.5, +16 → 시선 0, 0.4, −11)

window.__veh = { scene, entries, V, state, statOf };
const labels = document.getElementById('labels');
const sumEl = document.getElementById('sum');
let tiles = [];
let dirty = true;


function setupTiles() {
  const road = makeRoad(40, 60); scene.add(road);
  for (const k of kinds) { const obj = mkVehicle(k); scene.add(obj); entries.push({ kind: k, obj }); }
  if (state.proj) {
    for (const k of V.PROJECTILE_KINDS) {

      if (k === 'tack') obj.rotation.x = 0.5;

    }
    { const obj = V.buildProjectile('cup'); obj.position.y = 0.45; obj.scale.set(1.6, 0.25, 1.6); scene.add(obj); entries.push({ kind: 'cup(웅덩이)', obj, isProj: true }); }

  }

}

function layout() {
  labels.innerHTML = '';
  tiles = [];
  const W = innerWidth, H = innerHeight;
  const veh = entries.filter((e) => !e.isProj), prj = entries.filter((e) => e.isProj);
  const projH = prj.length ? Math.round(H * (veh.length ? 0.2 : 1)) : 0;
  const cols = +(Q.get('cols') || Math.min(veh.length, Math.max(1, Math.round(Math.sqrt(veh.length * (W / Math.max(1, H - projH)) / 1.25)))));
  const rows = Math.ceil(veh.length / Math.max(1, cols));

  veh.forEach((e, i) => tiles.push({ e, x: (i % cols) * tw, y: Math.floor(i / cols) * th, w: tw, h: th }));
  if (prj.length) {
    const pc = Math.min(prj.length, +(Q.get('pcols') || prj.length)); const pr = Math.ceil(prj.length / pc);
    const pw = W / pc, ph = projH / pr;
    prj.forEach((e, i) => tiles.push({ e, x: (i % pc) * pw, y: H - projH + Math.floor(i / pc) * ph, w: pw, h: ph }));

    const el = document.createElement('div'); el.className = 'lb';
    el.style.left = t.x + 3 + 'px'; el.style.top = t.y + 3 + 'px';
    labels.appendChild(el); t.el = el;
    t.cam = new THREE.PerspectiveCamera(20, t.w / t.h, 0.3, 400);

}

function refreshLabels() {

    const e = t.e, ud = e.obj.userData, s = statOf(e.obj);

    else {

      const bb = new THREE.Box3();

      t.el.classList.toggle('bad', bad);
      lines.push(`${e.kind.padEnd(13)} ${String(s.tris).padStart(5)} tris  ${s.meshes} meshes  [${s.names.join(',')}]`);
    }

  }

  if (flag('stats')) { sumEl.style.display = 'block'; sumEl.textContent = lines.join('\n'); }
}

function renderTiles(time) {
  const H = innerHeight;
  const off = OFFS[view] || OFFS.rear;
  for (const t of tiles) {
    for (const e of entries) e.obj.visible = e === t.e;
    const o = t.e.obj;
    // 맞춤: 같은 각도(추격캠 오프셋)에서 FOV 만 좁혀 확대 → 원근은 게임과 동일
    const bb = visBox(o);
    if (t.e.marker) bb.set(new THREE.Vector3(-1.6, 0, -1.6), new THREE.Vector3(1.6, 0.1, 1.6));
    const c = bb.getCenter(new THREE.Vector3()); const R = Math.max(0.35, bb.getSize(new THREE.Vector3()).length() / 2);
    const cam = t.cam; const dir = new THREE.Vector3(...off);
    const dist = Math.max(dir.length(), R * 3);

  }

}

// ── 측면 정사영 라인업 (비율 비교)
let lineupCam = null;

    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.05, 4, 0.05), tick); pole.position.set(-1.6, -r * rowH + 2, 4); scene.add(pole);
    for (let i = 1; i <= 4; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.05), tick); b.position.set(-1.6, -r * rowH + i, 4); scene.add(b); }
  }

  sun.shadow.camera.left = -60; sun.shadow.camera.right = 60; sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;

    const p = e.obj.position.clone().setY(e.obj.position.y + e.obj.userData.height + 0.25).project(lineupCam);
    el.style.left = ((p.x + 1) / 2) * innerWidth - 40 + 'px'; el.style.top = ((1 - p.y) / 2) * innerHeight - 32 + 'px';

// ── 정체 장면 (게임 추격캠 그대로)
let jamCam = null, jamPlayer = null, jamVillain = null;
function setupJam() {

  const road = makeRoad(60, 360, -120); scene.add(road);
  const stage = STAGES[(+(Q.get('stage') || 1)) - 1] || STAGES[0];
  const pLane = 2;
  jamPlayer = V.buildVehicle('player', { detailed: true }); jamPlayer.position.set(laneX(pLane), 0, 0); scene.add(jamPlayer);
  // 원흉 (앞 45m)
  const vs = stage.villains[0];
  jamVillain = V.buildVehicle(vs.kind, { color: vs.color, detailed: true });
  jamVillain.position.set(laneX(0) + (vs.lane - 0) * LANE_W, 0, -48); scene.add(jamVillain);
  for (let l = 0; l < NUM_LANES; l++) {
    let s = l === pLane ? 9 : -14 + rnd() * 6;

      const k = pick(); const pal = rnd() < 0.68 ? NPC_COLORS_MONO : NPC_COLORS_POP;
      const car = V.buildVehicle(k, { color: pal[Math.floor(rnd() * pal.length)], seed: Math.floor(rnd() * 1e6) });
      const L = car.userData.length; s += L / 2;
      if (l === 0 && s > 38 && s < 58) { s = 58; }
      car.position.set(laneX(l), 0, -s); scene.add(car); jamCars.push(car);
      s += L / 2 + 2 + rnd() * 3.5;
    }
  }
  // 반대편 차로
  for (let i = 0; i < 10; i++) {
    const k = pick(); const car = V.buildVehicle(k, { color: NPC_COLORS_MONO[i % NPC_COLORS_MONO.length], seed: i });
    car.rotation.y = Math.PI; car.position.set(OPP_LANE_X(i % 4), 0, -i * 22 + 10); scene.add(car); jamCars.push(car);
  }
  // 투하 경고 + 떨어진 투척물
  const m1 = V.buildWarningMarker(); m1.position.set(laneX(pLane), 0.04, -11); m1.userData.setProgress(0.35); scene.add(m1);
  const m2 = V.buildWarningMarker(); m2.position.set(laneX(pLane - 1), 0.04, -13); m2.userData.setProgress(0.85); scene.add(m2);
  const cup = V.buildProjectile('cup'); cup.position.set(laneX(pLane + 1), 0.45, -16); cup.scale.set(1.6, 0.25, 1.6); scene.add(cup);
  const wm = V.buildProjectile('watermelon'); wm.position.set(laneX(pLane), 0.45, -24); scene.add(wm);
  const fly = V.buildProjectile(stage.throwItem || 'cup'); fly.position.set(laneX(1), 4.5, -28); fly.rotation.set(0.7, 0, 0.4); scene.add(fly);
  for (let i = 0; i < 4; i++) { const t = V.buildProjectile('tack'); t.position.set(laneX(pLane) + (i - 1.5) * 0.3, 2.2 + i * 0.5, -3 - i * 2.2); t.rotation.x = i; scene.add(t); }
  const ms = V.buildProjectile('missile'); ms.position.set(laneX(pLane) - 2, 6, -18); ms.lookAt(ms.position.clone().add(new THREE.Vector3(-0.5, -0.4, -1))); scene.add(ms);
  entries.push({ kind: 'player', obj: jamPlayer });
  const boss = Q.get('cam') === 'boss';
  jamCam = new THREE.PerspectiveCamera(boss ? 46 : 42, innerWidth / innerHeight, 0.5, 1400);
  const px = laneX(pLane);
  if (boss) { jamCam.position.set(px * 0.4 + 3.4, 11.5, 12); jamCam.lookAt((px + jamVillain.position.x) * 0.45, 0.6, -(24 + 3)); }
  else { jamCam.position.set(px * 0.45 + 2.4, 12.5, 16); jamCam.lookAt(px * 0.6, 0.4, -11); }
  aimSun(0, -30, 60);
  if (night) { scene.fog = new THREE.Fog(sky.fog, sky.fogNear, sky.fogFar); } else scene.fog = new THREE.Fog(sky.fog, sky.fogNear, sky.fogFar);
  applyLights();
  V.setHeadlights(jamPlayer, state.head); V.setHeadlights(jamVillain, state.head);
  const tot = statOf(scene);
  window.__veh.jam = { cars: jamCars.length, meshes: tot.meshes, tris: tot.tris };
  if (flag('stats')) { sumEl.style.display = 'block'; sumEl.textContent = `jam: ${jamCars.length} NPC  ${tot.meshes} visible meshes  ${tot.tris} tris`; }
}

if (view === 'jam') setupJam();
else if (view === 'lineup') setupLineup();
else setupTiles();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.anim) {
    const t = now / 1000;
    const blink = Math.floor(t * 2) % 2 === 0;
    for (const e of entries) {
      if (e.isProj) { if (e.kind === 'tack') e.obj.rotation.x += dt * 6; if (e.marker) e.obj.userData.setProgress((t * 0.5) % 1); continue; }
      const ud = e.obj.userData, r = ud.wheelRadius || 0.4;
      for (const w of ud.wheels || []) w.rotation.x -= (6 * dt) / r;
      if (ud.body) { ud.body.position.y = Math.sin(t * 30) * 0.012; ud.body.rotation.x = Math.sin(t * 1.7) * 0.04; ud.body.rotation.z = Math.sin(t * 1.3) * 0.03; }
      if (state.hazard) V.setHazard(e.obj, blink);
      if (state.siren && V.setSiren) V.setSiren(e.obj, t);
    }
    dirty = true;
  }
  if (dirty) {
    renderer.setScissorTest(view !== 'jam' && view !== 'lineup');
    if (view === 'jam') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, jamCam); }
    else if (view === 'lineup') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, lineupCam); }
    else { renderTiles(now); refreshLabels(); }
    dirty = false;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); if (view !== 'jam' && view !== 'lineup') layout(); dirty = true; });
// 폰트 로드 후 (꿀수박 간판) 다시 그리기
document.fonts?.ready.then(() => { dirty = true; });
</script>
</body>
