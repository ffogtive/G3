// ── 측면 정사영 라인업 (비율 비교)

  if (hw < (maxX + 3) / 2) { hw = (maxX + 3) / 2; hh = hw / aspect; }
  lineupCam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 200);
  lineupCam.position.set(maxX / 2 - 1, cy, 40); lineupCam.lookAt(maxX / 2 - 1, cy, 0);
  sun.shadow.camera.left = -60; sun.shadow.camera.right = 60; sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
  aimSun(maxX / 2, 0, Math.max(maxX, rows * rowH) / 2 + 4);
  applyLights();
  for (const e of entries) {
    const el = document.createElement('div'); el.className = 'lb';
    const p = e.obj.position.clone().setY(e.obj.position.y + e.obj.userData.height + 0.25).project(lineupCam);
    el.style.left = ((p.x + 1) / 2) * innerWidth - 40 + 'px'; el.style.top = ((1 - p.y) / 2) * innerHeight - 32 + 'px';
    el.innerHTML = `<b>${e.kind}</b>\n${e.obj.userData.length}×${e.obj.userData.width}×${e.obj.userData.height}`; labels.appendChild(el);
  }
}

// ── 정체 장면 (게임 추격캠 그대로)
let jamCam = null, jamPlayer = null, jamVillain = null;
function setupJam() {
  jamCars = [];
  let rs = 1234 + seed; const rnd = () => ((rs = (rs * 16807) % 2147483647) / 2147483647);
  const pick = () => { let tot = 0; for (const [, w] of NPC_KINDS) tot += w; let r = rnd() * tot; for (const [k, w] of NPC_KINDS) if ((r -= w) <= 0) return k; return 'sedan'; };
  const road = makeRoad(60, 360, -120); scene.add(road);
  const stage = STAGES[(+(Q.get('stage') || 1)) - 1] || STAGES[0];
  const pLane = 2;
  const bossCam = Q.get('cam') === 'boss';
  jamPlayer = V.buildVehicle(Q.get('car') || 'player', { detailed: true }); jamPlayer.position.set(laneX(pLane), 0, 0); scene.add(jamPlayer);
  // 원흉 (앞 45m)
  const vs = stage.villains[0];
  jamVillain = V.buildVehicle(vs.kind, { color: vs.color, detailed: true });
  jamVillain.position.set(laneX(0) + (vs.lane - 0) * LANE_W, 0, bossCam ? -15 : -48); scene.add(jamVillain);
  if (stage.villains[1]) { const v2 = V.buildVehicle(stage.villains[1].kind, { color: stage.villains[1].color, detailed: true }); v2.position.set(laneX(stage.villains[1].lane), 0, bossCam ? -15 : -48); scene.add(v2); V.setBrake(v2, true); }
  if (Q.has('vbrake')) V.setBrake(jamVillain, true);
  for (let l = 0; l < NUM_LANES; l++) {
    let s = l === pLane ? 9 : -14 + rnd() * 6;
    while (s < 150) {
      const k = pick(); const pal = rnd() < 0.68 ? NPC_COLORS_MONO : NPC_COLORS_POP;
      const car = V.buildVehicle(k, { color: pal[Math.floor(rnd() * pal.length)], seed: Math.floor(rnd() * 1e6) });
      const L = car.userData.length; s += L / 2;
      if (bossCam ? (s > -6 && s < 34) : (l === 0 && s > 38 && s < 58)) { s = bossCam ? 34 : 58; }
      car.position.set(laneX(l), 0, -s); scene.add(car); jamCars.push(car);
      s += L / 2 + 2 + rnd() * 3.5;
    }
  }
  // 반대편 차로
  for (let i = 0; i < 10; i++) {
    const k = pick(); const car = V.buildVehicle(k, { color: NPC_COLORS_MONO[i % NPC_COLORS_MONO.length], seed: i });
    car.rotation.y = Math.PI; car.position.set(OPP_LANE_X(i % 4), 0, -i * 22 + 10); scene.add(car); jamCars.push(car);
  }
  // 투하 경고 + 떨어진 투척물
  const m1 = V.buildWarningMarker(); m1.position.set(laneX(pLane), 0.04, -11); m1.userData.setProgress(0.35); scene.add(m1);
  const m2 = V.buildWarningMarker(); m2.position.set(laneX(pLane - 1), 0.04, -13); m2.userData.setProgress(0.85); scene.add(m2);
  const cup = V.buildProjectile('cup'); cup.position.set(laneX(pLane + 1), 0.45, -16); cup.scale.set(1.6, 0.25, 1.6); scene.add(cup);
  const wm = V.buildProjectile('watermelon'); wm.position.set(laneX(pLane), 0.45, -24); scene.add(wm);
  const fly = V.buildProjectile(stage.throwItem || 'cup'); fly.position.set(laneX(1), 4.5, -28); fly.rotation.set(0.7, 0, 0.4); scene.add(fly);
  for (let i = 0; i < 4; i++) { const t = V.buildProjectile('tack'); t.position.set(laneX(pLane) + (i - 1.5) * 0.3, 2.2 + i * 0.5, -3 - i * 2.2); t.rotation.x = i; scene.add(t); }
  const ms = V.buildProjectile('missile'); ms.position.set(laneX(pLane) - 2, 6, -18); ms.lookAt(ms.position.clone().add(new THREE.Vector3(-0.5, -0.4, -1))); scene.add(ms);
  entries.push({ kind: 'player', obj: jamPlayer });
  const boss = bossCam;
  jamCam = new THREE.PerspectiveCamera(boss ? 46 : 42, innerWidth / innerHeight, 0.5, 1400);
  const px = laneX(pLane);
  if (boss) { jamCam.position.set(px * 0.4 + 3.4, 11.5, 12); jamCam.lookAt((px + jamVillain.position.x) * 0.45, 0.6, -(7.5 + 3)); }
  else { jamCam.position.set(px * 0.45 + 2.4, 12.5, 16); jamCam.lookAt(px * 0.6, 0.4, -11); }
  aimSun(0, -30, 60);
  if (night) { scene.fog = new THREE.Fog(sky.fog, sky.fogNear, sky.fogFar); } else scene.fog = new THREE.Fog(sky.fog, sky.fogNear, sky.fogFar);
  applyLights();
  V.setHeadlights(jamPlayer, state.head); V.setHeadlights(jamVillain, state.head);
  const tot = statOf(scene);
  window.__veh.jam = { cars: jamCars.length, meshes: tot.meshes, tris: tot.tris };
  if (flag('stats')) { sumEl.style.display = 'block'; sumEl.textContent = `jam: ${jamCars.length} NPC  ${tot.meshes} visible meshes  ${tot.tris} tris`; }
}

// ── 상점 아이템 (?view=items): 0 = 차 4종 추격캠(뒤) / 1 = 차 4종 앞 3/4 / 2 = 새 탄 + 연출 소품 / 3 = 피니시 조합 (원점 확인)
function setupItems() {
  const road = makeRoad(60, 80); scene.add(road);
  const only = Q.has('kinds') ? new Set(Q.get('kinds').split(',')) : null, want = (k) => !only || only.has(k);
  const rowsOn = (Q.get('rows') || '0123').split('').map(Number), R = (r) => rowsOn.includes(r);
  for (const k of SHOP_CARS.filter(want)) { if (!R(0)) break; const o = V.buildVehicle(k, { detailed: true }); scene.add(o); entries.push({ kind: k, obj: o, row: 0, off: OFFS.rear, rowW: 1.15 }); }
  for (const k of SHOP_CARS.filter(want)) { if (!R(1)) break; const o = V.buildVehicle(k, { detailed: true }); scene.add(o); entries.push({ kind: k, obj: o, row: 1, off: OFFS.front, rowW: 1.0 }); }
  for (const k of ['tack', 'caltrop', 'waterBalloon', 'gum', 'box', 'tire', 'cone'].filter(want)) { if (!R(2)) break;
    const o = V.buildProjectile(k); o.position.y = 0.45; if (k === 'tack') o.rotation.x = 0.5; scene.add(o);
    entries.push({ kind: k, obj: o, isProj: true, row: 2, off: OFFS.rear, rowW: 0.8 });
  }
  for (const k of V.FX_PROP_KINDS.filter(want)) { if (!R(2)) break;
    const o = V.buildFxProp(k); if (k === 'drone') o.position.y = 1.2; scene.add(o);
    entries.push({ kind: k, obj: o, isProj: true, row: 2, off: k === 'drone' ? OFFS.rear : OFFS.item, rowW: 0.8 });
  }
  const combo = (name, prop, place) => {
    if (!R(3) || !want(prop)) return;
    const g = new THREE.Group(); const car = V.buildVehicle(Q.get('car') || 'player', { detailed: true }); g.add(car);
    const p = V.buildFxProp(prop); g.add(p); place(car, p); scene.add(g);
    if (V.setStrobe) V.setStrobe(car, state.siren ? true : null);
    entries.push({ kind: name, obj: g, isProj: true, combo: true, row: 3, off: OFFS.rear, rowW: 1.25 });
  };
  combo('heli 피니시', 'helicopter', (car, p) => { car.position.y = 2.2; car.rotation.x = -0.12; p.position.set(0, 2.2 + car.userData.height, 0.25); });
  combo('ufo 피니시', 'ufo', (car, p) => { car.position.y = 3.5; car.rotation.set(0.35, 0.6, 0.25); });
  combo('풍선 피니시', 'balloons', (car, p) => { car.position.y = 1.6; car.rotation.z = 0.1; p.position.set(0, 1.6 + (car.userData.beaconPos?.[1] ?? 1.5) - 0.12, 0.6); p.userData.bunch.rotation.z = -0.12; });
  combo('드론 따라옴', 'drone', (car, p) => { p.position.set(1.4, 5.2, 2.2); p.rotation.y = 0.15; });
  applyLights();
  layout();
}
// 연출 소품 애니 (anim=1): 로터 회전, 풍선 흔들림, 림 전구/REC/스트로브 점멸, UFO 회전
function animProps(root, t, dt) {
  root.traverse((o) => {
    const u = o.userData; if (!u || !u.kind) return;
    if (u.rotors) u.rotors.forEach((r, i) => { r.rotation.y += dt * 40 * (i % 3 === 0 ? 1 : -1); });
    if (u.rotor) u.rotor.rotation.y += dt * 18;
    if (u.tailRotor) u.tailRotor.rotation.x += dt * 30;
    if (u.bunch) { u.bunch.rotation.z = Math.sin(t * 1.3) * 0.08; u.bunch.rotation.x = Math.sin(t * 0.9) * 0.06; u.bunch.position.y = Math.sin(t * 2) * 0.05; }
    if (u.lights) { const ph = Math.floor(t * 4) % 2 === 0; u.lights[0].visible = ph; u.lights[1].visible = !ph; }
    if (u.saucer) u.saucer.rotation.y += dt * 0.8;
    if (u.rec) u.rec.visible = Math.floor(t * 2) % 2 === 0;
    if (u.hook && u.kind !== 'helicopter') u.hook.rotation.x = Math.sin(t * 2.2) * 0.25;
    if (u.strobe && V.setStrobe) V.setStrobe(o, state.siren ? t : null);
  });
}

if (view === 'jam') setupJam();
else if (view === 'lineup') setupLineup();
else if (view === 'items') setupItems();
else setupTiles();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.anim) {
    const t = now / 1000;
    const blink = Math.floor(t * 2) % 2 === 0;
    for (const e of entries) {
      animProps(e.obj, t, dt);
      if (e.isProj) { if (e.kind === 'tack' || e.kind === 'caltrop') e.obj.rotation.x += dt * 6; if (e.marker) e.obj.userData.setProgress((t * 0.5) % 1); continue; }
      const ud = e.obj.userData, r = ud.wheelRadius || 0.4;
      for (const w of ud.wheels || []) w.rotation.x -= (6 * dt) / r;
      if (ud.body) { ud.body.position.y = Math.sin(t * 30) * 0.012; ud.body.rotation.x = Math.sin(t * 1.7) * 0.04; ud.body.rotation.z = Math.sin(t * 1.3) * 0.03; }
      if (state.hazard) V.setHazard(e.obj, blink);
      if (state.siren && V.setSiren) V.setSiren(e.obj, t);
    }
    dirty = true;
  }
  if (dirty) {
    renderer.setScissorTest(view !== 'jam' && view !== 'lineup');
    if (view === 'jam') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, jamCam); }
    else if (view === 'lineup') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, lineupCam); }
    else { renderTiles(now); refreshLabels(); }
    dirty = false;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); if (view !== 'jam' && view !== 'lineup') layout(); dirty = true; });
// 폰트 로드 후 (꿀수박 간판) 다시 그리기
document.fonts?.ready.then(() => { dirty = true; });
</script>
