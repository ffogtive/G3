    }

function renderTiles(time) {
  const H = innerHeight;
  for (const t of tiles) {
    const off = (Q.has('off') ? Q.get('off').split(',').map(Number) : null) || t.off || OFFS[view] || OFFS.rear;
    for (const e of entries) e.obj.visible = e === t.e;
    const o = t.e.obj;
    // 맞춤: 같은 각도(추격캠 오프셋)에서 FOV 만 좁혀 확대 → 원근은 게임과 동일
    const bb = visBox(o);
    if (t.e.marker) bb.set(new THREE.Vector3(-1.6, 0, -1.6), new THREE.Vector3(1.6, 0.1, 1.6));
    const c = bb.getCenter(new THREE.Vector3()); const R = Math.max(0.35, bb.getSize(new THREE.Vector3()).length() / 2);
    const cam = t.cam; const dir = new THREE.Vector3(...off);
    const dist = Math.max(dir.length(), R * 3);
    cam.position.copy(c).addScaledVector(dir.normalize(), dist);
    cam.lookAt(c);
    const fitV = 2 * Math.atan((R * 1.1) / dist), fitH = 2 * Math.atan((R * 1.1) / dist / cam.aspect);
    cam.fov = THREE.MathUtils.radToDeg(Math.max(fitV, fitH));
    cam.updateProjectionMatrix();
    aimSun(c.x, c.z, Math.max(4, R * 1.4));
    // 깜빡이 후광(Points)은 FOV 확대를 안 따라가므로 게임(42°, 전체 화면)과 같은 겉보기 크기로 보정
    V.MAT.blinkHalo.size = HALO * (Math.tan(THREE.MathUtils.degToRad(21)) / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2))) * (t.h / H);
    renderer.setViewport(t.x, H - t.y - t.h, t.w, t.h);
    renderer.setScissor(t.x, H - t.y - t.h, t.w, t.h);
    renderer.render(scene, cam);
  }
  V.MAT.blinkHalo.size = HALO;
  for (const e of entries) e.obj.visible = true;
}

let lineupCam = null;
function setupLineup() {
  // 여러 줄로 감싸기 (줄마다 y 를 내려 쌓음 — 정사영 측면이라 원근 왜곡 없음)
  const maxW = +(Q.get('rowW') || 34), gap = 1.0, rowH = 5.2;
  let x = 0, row = 0, maxX = 0;
  for (const k of kinds) {
    const obj = mkVehicle(k); obj.rotation.y = -Math.PI / 2; // 앞(−Z) → 화면 오른쪽
    const L = obj.userData.length;
    if (x > 0 && x + L > maxW) { row++; x = 0; }
    obj.position.set(x + L / 2, -row * rowH, 0); x += L + gap; maxX = Math.max(maxX, x);
    scene.add(obj); entries.push({ kind: k, obj });
  }
  const rows = row + 1;
  const strip = new THREE.MeshLambertMaterial({ color: asphalt });
  const tick = new THREE.MeshBasicMaterial({ color: 0xff3b30 });
  for (let r = 0; r < rows; r++) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(maxX + 4, 0.1, 8), strip); p.position.set(maxX / 2 - 1, -r * rowH - 0.05, 0); p.receiveShadow = true; scene.add(p);
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.05, 4, 0.05), tick); pole.position.set(-1.6, -r * rowH + 2, 4); scene.add(pole);
    for (let i = 1; i <= 4; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.05), tick); b.position.set(-1.6, -r * rowH + i, 4); scene.add(b); }
  }
  const aspect = innerWidth / innerHeight;
  const top = 4.4, bottom = -(rows - 1) * rowH - 0.6, cy = (top + bottom) / 2;
  let hh = (top - bottom) / 2, hw = hh * aspect;
  if (hw < (maxX + 3) / 2) { hw = (maxX + 3) / 2; hh = hw / aspect; }
  lineupCam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 200);
  lineupCam.position.set(maxX / 2 - 1, cy, 40); lineupCam.lookAt(maxX / 2 - 1, cy, 0);
  sun.shadow.camera.left = -60; sun.shadow.camera.right = 60; sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
  aimSun(maxX / 2, 0, Math.max(maxX, rows * rowH) / 2 + 4);
  applyLights();
  for (const e of entries) {
    const el = document.createElement('div'); el.className = 'lb';
    const p = e.obj.position.clone().setY(e.obj.position.y + e.obj.userData.height + 0.25).project(lineupCam);
    el.style.left = ((p.x + 1) / 2) * innerWidth - 40 + 'px'; el.style.top = ((1 - p.y) / 2) * innerHeight - 32 + 'px';
    el.innerHTML = `<b>${e.kind}</b>\n${e.obj.userData.length}×${e.obj.userData.width}×${e.obj.userData.height}`; labels.appendChild(el);
  }
}

// 연출 소품 애니 (anim=1): 로터 회전, 풍선 흔들림, 림 전구/REC/스트로브 점멸, UFO 회전
function animProps(root, t, dt) {
  root.traverse((o) => {
    const u = o.userData; if (!u || !u.kind) return;
    if (u.rotors) u.rotors.forEach((r, i) => { r.rotation.y += dt * 40 * (i % 3 === 0 ? 1 : -1); });
    if (u.rotor) u.rotor.rotation.y += dt * 18;
    if (u.tailRotor) u.tailRotor.rotation.x += dt * 30;
    if (u.bunch) { u.bunch.rotation.z = Math.sin(t * 1.3) * 0.08; u.bunch.rotation.x = Math.sin(t * 0.9) * 0.06; u.bunch.position.y = Math.sin(t * 2) * 0.05; }
    if (u.lights) { const ph = Math.floor(t * 4) % 2 === 0; u.lights[0].visible = ph; u.lights[1].visible = !ph; }
    if (u.saucer) u.saucer.rotation.y += dt * 0.8;
    if (u.rec) u.rec.visible = Math.floor(t * 2) % 2 === 0;
    if (u.hook && u.kind !== 'helicopter') u.hook.rotation.x = Math.sin(t * 2.2) * 0.25;
    if (u.strobe && V.setStrobe) V.setStrobe(o, state.siren ? t : null);
  });
}

  const pick = () => { let tot = 0; for (const [, w] of NPC_KINDS) tot += w; let r = rnd() * tot; for (const [k, w] of NPC_KINDS) if ((r -= w) <= 0) return k; return 'sedan'; };
  const pS = 40, pLane = 2, px = laneX(pLane);

  const bikes = [[0, 121, 0, 'stand'], [1, 126, 1, 'oneHand'], [0, 131, 2, 'noHands'], [2, 124, 3, 'ride'], [1, 133, 0, 'lie']];

      const L = car.userData.length; s += L / 2;

  }
  // B) #4 차선물기: 발광 점선 + 빨간 빗금 + 거대한 자 + '내 차로' 스티커
  { const ox = 200; roadAt(ox);

    const mt = SC.buildMergeTaper({ length: 120, taper: 40 }); mt.position.set(ox, 0, 60); scene.add(mt); mt.userData.setZip(+(Q.get('zip') || 0.55), 0);

    npcRow(ox, 3, 8, 50); npcRow(ox, 2, 2, 50);

  { const ox = 600; roadAt(ox, 4, { wet: true });

function setupP1() { setupTiles(); }

if (view === 'jam') setupJam();
else if (view === 'lineup') setupLineup();
else if (view === 'items') setupItems();
else if (view === 'blinker') { jamCars = []; setupBlinker(); }
else if (view === 'bikes') setupBikes();

else if (view === 'steer') setupSteer();

else if (view === 'props1') { jamCars = []; setupProps1(); }
else if (view === 'p1') { jamCars = []; setupP1(); }
else setupTiles();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.anim) {
    const t = now / 1000;
    const blink = Math.floor(t * 2) % 2 === 0;
    for (const e of entries) {
      animProps(e.obj, t, dt);
      if (e.isProj) { if (e.kind === 'tack' || e.kind === 'caltrop') e.obj.rotation.x += dt * 6; if (e.marker) e.obj.userData.setProgress((t * 0.5) % 1); continue; }
      const ud = e.obj.userData, r = ud.wheelRadius || 0.4;
      for (const w of ud.wheels || []) w.rotation.x -= (6 * dt) / r;
      if (ud.body) { ud.body.position.y = Math.sin(t * 30) * 0.012; ud.body.rotation.x = Math.sin(t * 1.7) * 0.04; ud.body.rotation.z = Math.sin(t * 1.3) * 0.03; }
      if (state.hazard) V.setHazard(e.obj, blink);
      if (state.siren && V.setSiren) V.setSiren(e.obj, t);
      if (e.obj.userData.__blink !== undefined) V.setBlinker(e.obj, e.obj.userData.__blink, t);
    }
    blinkAll(fullCars);
    dirty = true;
  }
  if (dirty) {
    renderer.setScissorTest(view !== 'jam' && view !== 'lineup' && view !== 'blinker');
    if (state.anim && animHooks.length) { const t = now / 1000; for (const f of animHooks) f(t); }
    if (stations) renderStations();
    else if (view === 'tunnel') renderTunnel();
    else if (view === 'blinker') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, fullCam); }
    else if (view === 'jam') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, jamCam); }
    else if (view === 'lineup') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, lineupCam); }
    else { renderTiles(now); refreshLabels(); }
    dirty = false;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); if (!stations && view !== 'jam' && view !== 'lineup' && view !== 'blinker' && view !== 'tunnel') layout(); if (fullCam) { fullCam.aspect = innerWidth / innerHeight; fullCam.updateProjectionMatrix(); } dirty = true; });
// 폰트 로드 후 (꿀수박 간판) 다시 그리기
document.fonts?.ready.then(() => { dirty = true; });
