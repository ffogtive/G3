// 연출 소품 애니 (anim=1): 로터 회전, 풍선 흔들림, 림 전구/REC/스트로브 점멸, UFO 회전
function animProps(root, t, dt) {
  root.traverse((o) => {
    const u = o.userData; if (!u || !u.kind) return;
    if (u.rotors) u.rotors.forEach((r, i) => { r.rotation.y += dt * 40 * (i % 3 === 0 ? 1 : -1); });
    if (u.rotor) u.rotor.rotation.y += dt * 18;
    if (u.tailRotor) u.tailRotor.rotation.x += dt * 30;
    if (u.bunch) { u.bunch.rotation.z = Math.sin(t * 1.3) * 0.08; u.bunch.rotation.x = Math.sin(t * 0.9) * 0.06; u.bunch.position.y = Math.sin(t * 2) * 0.05; }
    if (u.lights) { const ph = Math.floor(t * 4) % 2 === 0; u.lights[0].visible = ph; u.lights[1].visible = !ph; }
    if (u.saucer) u.saucer.rotation.y += dt * 0.8;
    if (u.rec) u.rec.visible = Math.floor(t * 2) % 2 === 0;
    if (u.hook && u.kind !== 'helicopter') u.hook.rotation.x = Math.sin(t * 2.2) * 0.25;
    if (u.strobe && V.setStrobe) V.setStrobe(o, state.siren ? t : null);
  });
}

  for (const [lane, s, v, pose] of bikes) {
    const b = V.buildVehicle('motorbike', { variant: v }); b.userData.setPose(pose);
    b.position.set(laneX(lane) + (rnd() - 0.5) * 1.2, 0, -s); b.rotation.y = (rnd() - 0.5) * 0.3;
    b.userData.__blink = lane === 1 ? 'hazard' : null; scene.add(b); fullCars.push(b);
  }
  const star = V.buildVehicle('starSedan'); star.position.set(laneX(1), 0, -(pS + 14)); star.userData.__blink = 'right'; scene.add(star); fullCars.push(star);
  for (let l = 0; l < NUM_LANES; l++) {
    let s = l === pLane ? pS + 7 : pS - 12 + rnd() * 6;
    while (s < 118) {
      const k = pick(); const pal = rnd() < 0.68 ? NPC_COLORS_MONO : NPC_COLORS_POP;
      const car = V.buildVehicle(k, { color: pal[Math.floor(rnd() * pal.length)], seed: Math.floor(rnd() * 1e6) });
      const L = car.userData.length; s += L / 2;
      if (l === 1 && s + L / 2 > pS + 14 - 3.4 && s - L / 2 < pS + 14 + 3.4) s = pS + 14 + 3.4 + 2.2 + L / 2; // 삼각별 세단 자리 비움
      car.position.set(laneX(l), 0, -s); scene.add(car); jamCars.push(car);
      if (l === 1 && s > 70 && s < 90 && !fullCars.zombie) { car.userData.__blink = 'left'; fullCars.zombie = car; fullCars.push(car); } // 좀비 깜빡이
      s += L / 2 + 2 + rnd() * 3.5;
    }
  }
  for (const c of [...jamCars, ...fullCars]) { V.setBrake(c, state.brake); V.setHeadlights(c, true); }
  V.setHeadlights(player, true);
  blinkAll(fullCars);
  const camChase = chaseCam(px, -pS, 'chase');
  const camPortal = chaseCam(px, 46, 'chase');
  const lead = fullCars[0];
  const camInside = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.3, 800);
  camInside.position.set(lead.position.x + 6.2, 3.6, lead.position.z - 12); camInside.lookAt(lead.position.x - 0.5, 1.6, lead.position.z + 4);
  tunnelTiles = { chase: { cam: camChase, inside: true, focus: [px, -pS - 10] }, portal: { cam: camPortal, inside: false, focus: [px, 10] }, inside: { cam: camInside, inside: true, focus: [lead.position.x, lead.position.z] } };
  const tot = statOf(scene);
  window.__veh.tunnelStats = { cars: jamCars.length + fullCars.length, meshes: tot.meshes, tris: tot.tris };
  if (flag('stats')) { sumEl.style.display = 'block'; sumEl.textContent = `tunnel: ${jamCars.length + fullCars.length} cars  ${tot.meshes} visible meshes  ${tot.tris} tris`; }
}
function renderTunnel() {
  const mode = Q.get('cam') || 'chase', W = innerWidth, H = innerHeight;
  const tiles = mode === 'all' ? [['chase', 0, 0, W * 0.62, H], ['portal', W * 0.62, 0, W * 0.38, H / 2], ['inside', W * 0.62, H / 2, W * 0.38, H / 2]] : [[mode, 0, 0, W, H]];
  renderer.setScissorTest(true);
  for (const [k, x, y, w, h] of tiles) {
    const T = tunnelTiles[k] || tunnelTiles.chase;
    applyAmbience(T.inside && !night);
    if (night) applyAmbience(false);
    aimSun(T.focus[0], T.focus[1], 50);
    T.cam.aspect = w / h; T.cam.updateProjectionMatrix();
    V.MAT.blinkHalo.size = HALO * (h / H);
    renderer.setViewport(x, H - y - h, w, h); renderer.setScissor(x, H - y - h, w, h);
    renderer.render(scene, T.cam);
  }
  V.MAT.blinkHalo.size = HALO;
}

if (view === 'jam') setupJam();
else if (view === 'lineup') setupLineup();
else if (view === 'items') setupItems();
else if (view === 'blinker') { jamCars = []; setupBlinker(); }
else if (view === 'bikes') setupBikes();
else if (view === 'tunnel') { jamCars = []; setupTunnel(); }
else setupTiles();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.anim) {
    const t = now / 1000;
    const blink = Math.floor(t * 2) % 2 === 0;
    for (const e of entries) {
      animProps(e.obj, t, dt);
      if (e.isProj) { if (e.kind === 'tack' || e.kind === 'caltrop') e.obj.rotation.x += dt * 6; if (e.marker) e.obj.userData.setProgress((t * 0.5) % 1); continue; }
      const ud = e.obj.userData, r = ud.wheelRadius || 0.4;
      for (const w of ud.wheels || []) w.rotation.x -= (6 * dt) / r;
      if (ud.body) { ud.body.position.y = Math.sin(t * 30) * 0.012; ud.body.rotation.x = Math.sin(t * 1.7) * 0.04; ud.body.rotation.z = Math.sin(t * 1.3) * 0.03; }
      if (state.hazard) V.setHazard(e.obj, blink);
      if (state.siren && V.setSiren) V.setSiren(e.obj, t);
      if (e.obj.userData.__blink !== undefined) V.setBlinker(e.obj, e.obj.userData.__blink, t);
    }
    blinkAll(fullCars);
    dirty = true;
  }
  if (dirty) {
    renderer.setScissorTest(view !== 'jam' && view !== 'lineup' && view !== 'blinker');
    if (view === 'tunnel') renderTunnel();
    else if (view === 'blinker') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, fullCam); }
    else if (view === 'jam') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, jamCam); }
    else if (view === 'lineup') { renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, lineupCam); }
    else { renderTiles(now); refreshLabels(); }
    dirty = false;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); if (view !== 'jam' && view !== 'lineup' && view !== 'blinker' && view !== 'tunnel') layout(); if (fullCam) { fullCam.aspect = innerWidth / innerHeight; fullCam.updateProjectionMatrix(); } dirty = true; });
// 폰트 로드 후 (꿀수박 간판) 다시 그리기
document.fonts?.ready.then(() => { dirty = true; });
</script>
</body>
