const SCN = {
  sparks: { label: '불꽃: 펑크 버스트 + 바퀴 끌림', cam: 'boss', dur: 2.6, t: 0.32,

    start(s) { resetVillain(); s.m = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.4), new THREE.MeshBasicMaterial({ color: 0xff3b30 })); scene.add(s.m); s.m.position.set(1.8, 1.5, 4); fx.smokeTrail(s.m, 0.7); s.hit = false; },

  trail: { label: '연기 꼬리 → 하늘로 발사', cam: 'kill', dur: 2.6, t: 0.9,

    tick(s, t, dt) { s.vel.y -= 5 * dt; villain.position.addScaledVector(s.vel, dt); villain.rotation.x += 6 * dt; villain.rotation.y += 9 * dt; if (t > 1.3 && villain.visible) { fx.twinkle(villain.position.clone()); villain.visible = false; } } },

    start(s) { resetVillain(); villain.visible = false; s.p = new THREE.Vector3(-4, 46, -48); fx.twinkle(s.p); } },

camModes.sky = (o) => { o.tPos.set(10, 30, -22); o.tLook.set(-4, 44, -48); o.k = 6; };

panel.insertAdjacentHTML('beforeend', '<h2>스피드라인 / 카메라 / 기타</h2>');
const row1 = document.createElement('div'); row1.className = 'row';
for (const v of [0, 0.3, 0.85, 1]) { const b = document.createElement('button'); b.textContent = String(v); b.onclick = () => fx.speedLines(v); row1.appendChild(b); }
panel.appendChild(row1);
const row2 = document.createElement('div'); row2.className = 'row';
for (const m of ['chase', 'boss', 'kill', 'droneFixed', 'sky']) { const b = document.createElement('button'); b.textContent = m.replace('Fixed', ''); b.onclick = () => setCam(m); row2.appendChild(b); }
panel.appendChild(row2);
const row3 = document.createElement('div'); row3.className = 'row';
for (const [l, f] of [['clear()', () => fx.clear()], ['낮', () => applySky('day')], ['밤', () => applySky('night')]]) { const b = document.createElement('button'); b.textContent = l; b.onclick = f; row3.appendChild(b); }
panel.appendChild(row3);

const statsEl = document.getElementById('stats');
let fpsAcc = 0, fpsN = 0, fps = 0, upMs = 0;
function drawStats() {
  const st = fx._debugStats();
  statsEl.textContent = `fps ${fps}  fx.update ${upMs.toFixed(2)}ms\ncalls ${renderer.info.render.calls}  tris ${renderer.info.render.triangles}\n` +
    Object.entries(st).map(([k, v]) => `${k.padEnd(12)}${v}`).join('\n');
}

function onResize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', onResize);

// 디버그 노출 (테스트 스크립트용)
Object.assign(window, { __fx: fx, __THREE: THREE, __scene: scene, __camera: camera, __renderer: renderer, __play: play, __step: step, __render: () => renderer.render(scene, camera), __player: player });

// ───────── 실행 모드
if (SHOT) {
  // 결정적: 고정 dt 로 대표 순간까지 진행한 뒤 한 프레임만 렌더하고 멈춘다.
  fx._seed(12345);
  const sc = SCN[SHOT] || SCN.explosion;
  const T = +(params.get('t') || sc.t);
  play(SCN[SHOT] ? SHOT : 'explosion');
  cam.snap = true; step(0);
  const DT = 1 / 60;
  for (let t = 0; t < T - 1e-6; t += DT) step(DT);
  renderer.render(scene, camera);
  window.__shotReady = true;
  window.__shotStats = fx._debugStats();
  drawStats();
} else if (!TEST) {
  let last = performance.now();
  let autoI = 0, autoNext = 0;
  const order = ['kill', 'explosion', 'sparks', 'missile', 'hit', 'smoke', 'debris', 'shockwave', 'trail', 'twinkle', 'confetti', 'hearts', 'speed', 'shake'];
  if (!AUTO) play('explosion');
  function frame(now) {
    requestAnimationFrame(frame);
    const raw = Math.max(0, (now - last) / 1000); last = now;
    const dt = Math.min(0.05, raw);
    if (AUTO && performance.now() > autoNext) {
      const name = order[autoI++ % order.length];
      play(name); autoNext = performance.now() + (SCN[name].dur + 0.4) * 1000;
    }
    const t0 = performance.now(); step(dt); upMs = upMs * 0.9 + (performance.now() - t0) * 0.1;
    renderer.render(scene, camera);
    fpsAcc += raw; fpsN++; if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; drawStats(); }
  }
  requestAnimationFrame(frame);
} else {
  renderer.render(scene, camera);
  window.__testReady = true;
}
</script>
</body>
</html>
