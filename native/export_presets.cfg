; Export presets (docs/NATIVE_PORT.md 1-2 / 4 / M1a; docs/MOBILE_BUILD.md). Option names checked against the
; Godot 4.7.2 sources (platform/ios/export/export_plugin.cpp, editor/export/editor_export_platform_apple_embedded.cpp)
; and by a container export of preset.0 into an Xcode project.
;
; NO PERSONAL IDENTIFIERS HERE (the repo is public):
;   application/app_store_team_id stays the placeholder "LANE1TEAM0" — Godot refuses to export with an empty
;   Team ID. tools/mac/ios_run.sh auto-detects the real team (keychain / LANE1_TEAM_ID / ~/.lane1/deploy.env),
;   patches it into the *generated* project.pbxproj and passes DEVELOPMENT_TEAM=... to xcodebuild.
;   Empty code_sign_identity_* + empty provisioning profiles => Godot writes CODE_SIGN_STYLE = Automatic.
; Godot may rewrite this file (adding every default option) when the editor saves presets; that is fine.

[preset.0]

name="iOS"
platform="iOS"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, tools/*, data/src/*, platform/ios/tests/*, *.md"
export_path="export/ios/lane1.xcodeproj"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
architectures/arm64=true
application/app_store_team_id="LANE1TEAM0"
application/export_method_debug=1
application/code_sign_identity_debug=""
application/code_sign_identity_release=""
application/provisioning_profile_uuid_debug=""
application/provisioning_profile_uuid_release=""
application/provisioning_profile_specifier_debug=""
application/provisioning_profile_specifier_release=""
application/export_method_release=1
application/bundle_identifier="com.ffogtive.lane1Chamgyoyuk"
application/signature=""
application/short_version="0.1.0"
application/version="1"
application/additional_plist_content=""
application/icon_interpolation=4
; Godot only writes the Xcode project; tools/mac/ios_run.sh runs xcodebuild + devicectl itself (guide §5).
application/export_project_only=true
application/delete_old_export_files_unconditionally=false
; 0 = iPhone (TARGETED_DEVICE_FAMILY "1"), 1 = iPad ("2"), 2 = both ("1,2"; the Godot default). Portrait phone game.
application/targeted_device_family=0
; Godot 4.7.2 default (get_minimum_deployment_target() == "15.0"); Metal needs >= 14. A12 (iPhone XS) runs iOS 18+.
application/min_ios_version="15.0"
modules/camera=false
entitlements/increased_memory_limit=false
entitlements/game_center=false
entitlements/push_notifications="Disabled"
entitlements/additional=""
capabilities/access_wifi=false
; The Mobile renderer already adds "iphone-ipad-minimum-performance-a12" to UIRequiredDeviceCapabilities;
; set explicitly so the A12 floor (docs/NATIVE_PORT.md 2, 성능 하한) does not depend on the renderer choice.
capabilities/performance_gaming_tier=false
capabilities/performance_a12=true
capabilities/additional=PackedStringArray()
shader_baker/enabled=true
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
privacy/camera_usage_description=""
privacy/microphone_usage_description=""
privacy/photolibrary_usage_description=""
icons/icon_1024x1024="res://platform/ios/icon_1024.png"
icons/icon_1024x1024_dark=""
icons/icon_1024x1024_tinted=""
storyboard/image_scale_mode=0
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.07, 0.08, 0.1, 1)

